name: Meeting V1 checks
on:
  push:
    branches: [dev-meeting-v1]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FUCKSEATS_USE_USER_DATA: "0"
      FUCKSEATS_DISABLE_DATABASE_ENCRYPTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install Django PyYAML openpyxl pypinyin cryptography pandas python-pptx xlrd waitress whitenoise tzdata pytz pywebview keyring
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test seats.tests_meeting_seating --verbosity 2

  windows-package:
    runs-on: windows-latest
    env:
      FUCKSEATS_APP_VERSION: "0.1.0-dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller pythonnet
      - run: python scripts/package.py
      - name: Verify packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/FuckSeats/FuckSeats.exe")) {
            throw "Windows executable was not produced."
          }
          Get-Item "dist/FuckSeats/FuckSeats.exe" | Format-List FullName,Length
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/FuckSeats/FuckSeats.exe" -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable smoke test failed with exit code $($process.ExitCode)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-seating-windows-dev
          path: dist/FuckSeats/
          if-no-files-found: error
