name: Meeting V1 checks
on:
  push:
    branches: [dev-meeting-v1]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FUCKSEATS_USE_USER_DATA: "0"
      FUCKSEATS_DISABLE_DATABASE_ENCRYPTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install Django PyYAML openpyxl pypinyin cryptography pandas python-pptx xlrd waitress whitenoise tzdata pytz pywebview keyring
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test seats.tests_meeting_seating --verbosity 2
