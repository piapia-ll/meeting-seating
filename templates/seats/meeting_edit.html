{% extends 'base.html' %}{% block title %}编辑会议{% endblock %}{% block content %}<div class="panel-card" style="max-width:1000px;margin:24px auto"><h2>编辑会议</h2><form method="post" action="{% url 'meeting_update' meeting.id %}">{% csrf_token %}<p><input name="name" value="{{meeting.name}}" required><input type="date" name="meeting_date" value="{{meeting.meeting_date|date:'Y-m-d'}}"></p><p><label><input type="checkbox" name="use_stage" {% if meeting.use_stage %}checked{% endif %}>使用主席台</label><select name="stage_mode"><option value="specified" {% if meeting.stage_mode == 'specified' %}selected{% endif %}>指定主席台人员</option><option value="auto" {% if meeting.stage_mode == 'auto' %}selected{% endif %}>自动</option></select></p><h3>本次参会人员</h3><div>{% for p in participants %}<label style="display:inline-block;margin:5px 14px"><input type="checkbox" name="participant_ids" value="{{p.id}}" {% if p.id in selected %}checked{% endif %}>{{p.name}}{% if p.department %}（{{p.department.name}}）{% endif %}</label>{% endfor %}</div><p><button class="btn btn-primary">保存会议</button> <a class="btn" href="{% url 'meeting_detail' meeting.id %}">取消</a></p></form><form method="post" action="{% url 'meeting_delete' meeting.id %}" onsubmit="return confirm('确定删除这场会议及其座位结果？人员库和会场不会删除。')">{% csrf_token %}<button class="btn btn-danger">删除会议</button></form></div>{% endblock %}
