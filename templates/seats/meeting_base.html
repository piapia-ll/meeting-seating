<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}会场排排座{% endblock %}</title>{% load static %}<link rel="stylesheet" href="{% static 'css/styles.css' %}?v=4.20"><meta name="csrf-token" content="{{ csrf_token }}"><style>
:root{--v2-bg:#f6f8fb;--v2-line:#e7eaf0;--v2-text:#172033;--v2-muted:#718096;--v2-blue:#2458d3}*{box-sizing:border-box}body{background:var(--v2-bg);color:var(--v2-text)}.app-header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--v2-line);box-shadow:none;position:sticky;top:0;z-index:30}.v2-nav{height:64px;max-width:1240px;margin:auto;padding:0 26px;display:flex;align-items:center;gap:30px}.v2-brand{font-weight:800;font-size:18px;color:#172033;text-decoration:none;white-space:nowrap}.v2-brand small{display:block;color:#94a3b8;font-size:10px;font-weight:500;margin-top:2px}.v2-links{display:flex;gap:6px;align-items:center}.v2-links a{color:#64748b;text-decoration:none;font-size:14px;font-weight:600;padding:8px 11px;border-radius:8px}.v2-links a:hover{background:#f1f5f9;color:#1e3a8a}.v2-spacer{flex:1}.v2-status{font-size:12px;color:#94a3b8}.v2-page{max-width:1180px;margin:auto;padding:34px 28px 60px}.v2-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}.v2-head h1{font-size:28px;margin:5px 0 7px}.v2-head p,.muted{color:var(--v2-muted);font-style:normal}.eyebrow{font-size:12px;color:#64748b;font-weight:700;letter-spacing:.08em}.v2-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}.v2-toolbar input{max-width:430px;flex:1;background:#fff}.v2-toolbar span{color:#94a3b8;font-size:12px}.v2-table,.v2-card{background:#fff;border:1px solid var(--v2-line);border-radius:15px;overflow:hidden}.v2-tr{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.4fr 1fr 60px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid #f0f2f5;font-size:13px}.v2-tr:last-child{border-bottom:0}.v2-tr a{color:#244c9c;text-decoration:none}.v2-th{background:#fafbfc;color:#94a3b8;font-size:11px;font-weight:700}.tag{display:inline-block;background:#eef4ff;color:#315ba8;border-radius:999px;padding:4px 8px;font-size:11px}.v2-empty{padding:38px;text-align:center;color:#94a3b8}.v2-dialog{width:min(680px,92vw);border:0;border-radius:18px;padding:0;box-shadow:0 22px 70px rgba(15,23,42,.22)}.v2-dialog::backdrop{background:rgba(15,23,42,.3)}.v2-dialog form{padding:24px}.dialog-head,.dialog-actions{display:flex;align-items:center;justify-content:space-between}.dialog-head h2{margin:0 0 20px}.dialog-head button{border:0;background:none;font-size:24px}.v2-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.v2-form label{font-size:12px;color:#64748b}.v2-form input,.v2-form select{display:block;width:100%;margin-top:6px}.dialog-actions{justify-content:flex-end;gap:8px;margin-top:22px}.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.history-card{display:block;background:#fff;border:1px solid var(--v2-line);border-radius:15px;padding:20px;text-decoration:none;color:inherit;transition:.15s}.history-card:hover{transform:translateY(-2px);border-color:#cbd8f5}.history-date{color:#94a3b8;font-size:11px}.history-card h3{margin:9px 0 7px;font-size:16px}.history-card p{color:#64748b;font-size:13px}.history-card span{color:#2458d3;font-size:12px;font-weight:700}.settings-grid{display:grid;gap:16px}.v2-card{padding:20px}.v2-card h2{font-size:17px;margin:0 0 4px}.inline-create,.setting-row{display:grid;grid-template-columns:1.5fr 100px 80px;gap:8px;margin-top:14px}.setting-row{grid-template-columns:1.5fr 100px 80px 70px;padding-top:12px;border-top:1px solid #f1f5f9}.setting-row.dept{grid-template-columns:1.4fr 1fr 80px 80px 70px}.data-card form{margin-top:12px}.btn{border-radius:9px!important}@media(max-width:800px){.v2-links{display:none}.history-grid{grid-template-columns:1fr}.v2-tr{grid-template-columns:1.2fr 1fr 1fr}.v2-tr span:nth-child(4),.v2-tr span:nth-child(5),.v2-tr span:nth-child(6){display:none}.v2-form{grid-template-columns:1fr}.setting-row,.setting-row.dept,.inline-create{grid-template-columns:1fr}}
</style>{% block extra_head %}{% endblock %}</head><body><header class="app-header"><nav class="v2-nav"><a class="v2-brand" href="{% url 'meeting_home' %}">会场排排座<small>OFFLINE MEETING SEATING</small></a><div class="v2-links"><a href="{% url 'meeting_home' %}">会议</a><a href="{% url 'participant_library' %}">参会人员</a><a href="{% url 'venue_library' %}">会场模板</a><a href="{% url 'meeting_history' %}">历史会议</a><a href="{% url 'meeting_settings' %}">设置</a></div><div class="v2-spacer"></div><span class="v2-status">● 本地离线</span><div>{% block actions %}{% endblock %}</div></nav></header><main>{% block content %}{% endblock %}</main>{% block extra_scripts %}{% endblock %}</body></html>
