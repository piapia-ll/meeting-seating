{% extends 'seats/meeting_base.html' %}{% block title %}编辑人员{% endblock %}{% block content %}<div class="panel-card" style="max-width:760px;margin:24px auto"><h2>编辑人员：{{person.name}}</h2><form method="post" action="{% url 'participant_update' person.id %}">{% csrf_token %}<p><input name="name" value="{{person.name}}" required></p><p><select name="category">{% for value,label in category_choices %}<option value="{{value}}" {% if person.category == value %}selected{% endif %}>{{label}}</option>{% endfor %}</select></p><p><select name="level_id"><option value="">无行政级别</option>{% for x in levels %}<option value="{{x.id}}" {% if person.personnel_level_id == x.id %}selected{% endif %}>{{x.name}}</option>{% endfor %}</select><select name="department_id"><option value="">无部门</option>{% for x in departments %}<option value="{{x.id}}" {% if person.department_id == x.id %}selected{% endif %}>{{x.name}}</option>{% endfor %}</select></p><p><input name="position" value="{{person.position}}" placeholder="职务"><input type="number" name="leader_order" value="{{person.leader_order}}"><input type="number" name="attendee_order" value="{{person.attendee_order}}"><input type="number" name="personal_order" value="{{person.personal_order}}"></p><p><input name="remark" value="{{person.remark}}" placeholder="备注"><label><input type="checkbox" name="active" {% if person.active %}checked{% endif %}>启用</label></p><button class="btn btn-primary">保存</button> <a class="btn" href="{% url 'meeting_home' %}">取消</a></form></div>{% endblock %}
